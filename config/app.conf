# Configuración de la aplicación.
# Formato: clave = valor. Las líneas que empiezan por # son comentarios.
# Las rutas relativas se buscan en la carpeta donde está este "config/".
#
# Lo que se cambia desde el programa (el idioma) no se guarda aquí sino en la
# carpeta del usuario, y tiene prioridad sobre este archivo:
#   Windows: %APPDATA%\DonatellaTech\Lulumoy Studio\settings.conf
#   Linux:   ~/.config/donatellatech/lulumoy/settings.conf

# Nombre de la ventana
window_title = Lulumoy Studio

# Icono de la ventana (PNG recomendado)
icon = assets/lulumoy_icon.png

# Pantalla inicial: logo y mensaje
welcome_logo = assets/logo.png

# Mensaje de la pantalla inicial. Use \n para un salto de línea.
# Si no se define ninguno, se usa el texto por defecto de cada idioma.
# Se puede dar uno general (welcome_message) o uno por idioma:
#welcome_message = Mi aplicación
#welcome_message.es = Bienvenido\nArchivo > Abrir para empezar
#welcome_message.en = Welcome\nFile > Open to start
#welcome_message.it = Benvenuto\nFile > Apri per iniziare

# Idioma inicial: es, en, it (el que se elige en el menú se guarda en settings.conf)
language = es

# Tamaño inicial de la ventana
window_width = 1000
window_height = 700
