<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#f4fbe9"/>
      <stop offset="1" stop-color="#d7eebf"/>
    </radialGradient>
    <linearGradient id="caparazon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd450"/>
      <stop offset="1" stop-color="#4f9e2a"/>
    </linearGradient>
    <linearGradient id="piel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e06e"/>
      <stop offset="1" stop-color="#6cb83d"/>
    </linearGradient>
    <radialGradient id="lente" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="0.55" stop-color="#2b78c2"/>
      <stop offset="1" stop-color="#123a66"/>
    </radialGradient>
  </defs>

  <!-- Insignia circular, como el logo -->
  <circle cx="128" cy="128" r="122" fill="url(#fondo)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="#1f5e1c" stroke-width="12"/>

  <!-- Patas traseras -->
  <path d="M70 170 q-6 22 4 30 h20 q6 -12 2 -30 z" fill="url(#piel)" stroke="#1f5e1c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M118 176 q-4 20 4 26 h20 q6 -10 2 -26 z" fill="url(#piel)" stroke="#1f5e1c" stroke-width="5" stroke-linejoin="round"/>

  <!-- Cola -->
  <path d="M44 160 q-14 4 -20 -4 q10 -4 24 -10 z" fill="url(#piel)" stroke="#1f5e1c" stroke-width="5" stroke-linejoin="round"/>

  <!-- Caparazón -->
  <path d="M38 166 C38 96 82 66 120 66 C160 66 196 98 196 166 Z" fill="url(#caparazon)" stroke="#1f5e1c" stroke-width="6" stroke-linejoin="round"/>
  <!-- Placas del caparazón -->
  <g fill="none" stroke="#2e7d32" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M98 92 L142 92 L156 122 L142 150 L98 150 L84 122 Z"/>
    <path d="M98 92 L84 76"/>
    <path d="M142 92 L156 76"/>
    <path d="M84 122 L48 126"/>
    <path d="M156 122 L188 126"/>
    <path d="M98 150 L92 164"/>
    <path d="M142 150 L148 164"/>
  </g>
  <!-- Borde inferior del caparazón -->
  <path d="M34 162 H200 q6 0 6 6 v2 q0 6 -6 6 H34 q-6 0 -6 -6 v-2 q0 -6 6 -6 z" fill="#3f8a22" stroke="#1f5e1c" stroke-width="5"/>

  <!-- Cuello y cabeza -->
  <path d="M180 150 q10 -26 30 -34 q8 14 0 40 q-14 8 -30 4 z" fill="url(#piel)" stroke="#1f5e1c" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="206" cy="104" rx="26" ry="22" fill="url(#piel)" stroke="#1f5e1c" stroke-width="5"/>
  <!-- Sonrisa -->
  <path d="M212 116 q8 4 14 -2" fill="none" stroke="#1f5e1c" stroke-width="4" stroke-linecap="round"/>

  <!-- Cámara, sostenida delante del ojo -->
  <g transform="translate(182 97) scale(1.18) translate(-182 -97) rotate(-8 182 98)">
    <rect x="150" y="76" width="56" height="40" rx="8" fill="#37474f" stroke="#1b2327" stroke-width="5"/>
    <rect x="160" y="68" width="18" height="10" rx="3" fill="#37474f" stroke="#1b2327" stroke-width="4"/>
    <circle cx="198" cy="84" r="4.5" fill="#ffd54f" stroke="#1b2327" stroke-width="1.5"/>
    <circle cx="176" cy="97" r="15" fill="url(#lente)" stroke="#1b2327" stroke-width="4"/>
    <circle cx="171" cy="92" r="4.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Pata delantera que sujeta la cámara -->
  <path d="M168 152 q0 -22 14 -34 q10 4 8 14 q-8 10 -6 22 z" fill="url(#piel)" stroke="#1f5e1c" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pata delantera de apoyo -->
  <path d="M160 176 q-4 20 4 26 h20 q6 -10 2 -26 z" fill="url(#piel)" stroke="#1f5e1c" stroke-width="5" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
