<h1>Cambiar formato</h1>
<p>Las imágenes se guardan con 8 bits (0–255) o 16 bits (0–65535) por canal, en grises (1 canal) o color (3 canales, más alfa opcional).</p>
<figure><math display="block"><mrow><msub><mi>v</mi><mn>16</mn></msub><mo>=</mo><mn>257</mn><mo>·</mo><msub><mi>v</mi><mn>8</mn></msub><mo>,</mo><mspace width="1.5em"/><msub><mi>v</mi><mn>8</mn></msub><mo>=</mo><mi mathvariant="normal">round</mi><mrow><mo>(</mo><mfrac><msub><mi>v</mi><mn>16</mn></msub><mn>257</mn></mfrac><mo>)</mo></mrow></mrow></math><figcaption>257 = 65535/255, así que 255 pasa exactamente a 65535 y la conversión de ida y vuelta no pierde nada. De 16 a 8 bits sí se pierde precisión.</figcaption></figure>
<figure><math display="block"><mrow><mi>Y</mi><mo>=</mo><mn>0.299</mn><mi>R</mi><mo>+</mo><mn>0.587</mn><mi>G</mi><mo>+</mo><mn>0.114</mn><mi>B</mi></mrow></math><figcaption>Luminancia (ITU-R BT.601) al pasar a escala de grises; el canal alfa se descarta.</figcaption></figure>
<figure><math display="block"><mrow><mi>R</mi><mo>=</mo><mi>G</mi><mo>=</mo><mi>B</mi><mo>=</mo><mi>Y</mi></mrow></math><figcaption>Al pasar de grises a color, los tres canales toman el mismo valor (el aspecto no cambia, pero permite aplicar operaciones de color).</figcaption></figure>
